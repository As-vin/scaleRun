name: ScaleRun
options:
  bundleIdPrefix: com.scalerun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""  # 替换为你的 Apple Developer Team ID

configs:
  Debug:
    buildSettings:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  Release:
    buildSettings:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  # 主 App Target
  ScaleRun:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Widgets/**"
          - "project.yml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scalerun.health
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "秤秤快跑"
        CODE_SIGN_STYLE: Manual
    capabilities:
      iCloud:
        properties:
          containers:
            - iCloud.com.scalerun.health
      appGroups:
        - group.com.scalerun.health
    dependencies:
      - sdk: Charts.framework
        status: required

  # Widget Extension Target
  ScaleRunWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Extensions/Color+Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scalerun.health.Widgets
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
    dependencies:
      - target: ScaleRun
      - sdk: WidgetKit.framework
        status: required

schemes:
  ScaleRun:
    build:
      targets:
        ScaleRun: all
        ScaleRunWidgets: [test]
    run:
      config: Debug
    archive:
      config: Release
