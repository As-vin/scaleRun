name: Build & Export iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: Create Xcode project from sources
        run: |
          brew install xcodegen
          cd ScaleRun
          xcodegen generate

      - name: Build for Simulator
        run: |
          cd ScaleRun
          xcodebuild build \
            -project ScaleRun.xcodeproj \
            -scheme ScaleRun \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Archive for device
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd ScaleRun
          xcodebuild archive \
            -project ScaleRun.xcodeproj \
            -scheme ScaleRun \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/ScaleRun.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Export IPA
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd ScaleRun
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ScaleRun.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            || echo "Export skipped (no signing certificate)"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScaleRun-Build
          path: |
            ScaleRun/build/
          retention-days: 14
